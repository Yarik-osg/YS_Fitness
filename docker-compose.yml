services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ys_fitness
      POSTGRES_USER: ys_fitness
      POSTGRES_PASSWORD: ys_fitness_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ys_fitness -d ys_fitness']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
