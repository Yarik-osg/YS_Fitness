name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ys_fitness_test
          POSTGRES_USER: ys_fitness
          POSTGRES_PASSWORD: ys_fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ys_fitness -d ys_fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://ys_fitness:ys_fitness_test@localhost:5432/ys_fitness_test?schema=public
      TEST_DATABASE_URL: postgresql://ys_fitness:ys_fitness_test@localhost:5432/ys_fitness_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
      CSRF_SECRET: ci-csrf-secret-at-least-32-characters
      WEB_ORIGINS: http://localhost:3000
      COOKIE_SAME_SITE: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run API integration tests
        run: pnpm test:e2e
